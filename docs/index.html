<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>新北市學區收入儀表板</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: #172033;
        --line: #26364f;
        --text: #f4f7fb;
        --muted: #aab7c9;
        --accent: #38bdf8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 12% 10%, rgba(56, 189, 248, 0.18), transparent 32rem),
          var(--bg);
        color: var(--text);
      }
      main {
        width: min(960px, calc(100% - 40px));
        margin: 0 auto;
        padding: 72px 0;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 10px 0 14px;
        font-size: clamp(36px, 6vw, 64px);
        line-height: 1.05;
        letter-spacing: 0;
      }
      p {
        color: var(--muted);
        font-size: 18px;
        line-height: 1.75;
        max-width: 780px;
      }
      .panel {
        margin-top: 36px;
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(23, 32, 51, 0.78);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin-top: 22px;
      }
      .metric {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        background: rgba(11, 18, 32, 0.54);
      }
      .metric strong {
        display: block;
        color: var(--accent);
        font-size: 28px;
        line-height: 1.1;
      }
      .metric span {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 14px;
      }
      a {
        color: var(--accent);
        font-weight: 800;
      }
      @media (max-width: 720px) {
        main {
          width: min(100% - 28px, 960px);
          padding: 44px 0;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Open Data Decision Dashboard</div>
      <h1>新北市學區收入儀表板</h1>
      <p>
        以里級綜所稅資料連結公立國中小學區，提供平均所得、中位數估算、
        趨勢與學區口徑。互動版使用 Streamlit 建置，GitHub Pages 此頁為靜態介紹頁。
      </p>

      <section class="panel">
        <h2>資料範圍</h2>
        <div class="grid">
          <div class="metric">
            <strong>107-112</strong>
            <span>收入資料年度</span>
          </div>
          <div class="metric">
            <strong>115</strong>
            <span>公立國中小學區</span>
          </div>
          <div class="metric">
            <strong>Streamlit</strong>
            <span>互動儀表板</span>
          </div>
        </div>
        <p>
          GitHub Pages 無法直接執行 Python/Streamlit。請使用 README 的部署說明，
          將互動版發布到 Streamlit Community Cloud 後，再把公開網址放回此頁。
        </p>
      </section>
    </main>
  </body>
</html>
